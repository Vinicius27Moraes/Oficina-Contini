name: deploy-local

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build e carga da imagem no cluster
        run: |
          TAG=${GITHUB_SHA::7}
          docker build -t oficina:$TAG ./oficina
          kind load docker-image oficina:$TAG --name oficina
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Deploy com rollback automático
        run: |
          kubectl set image deployment/web web=oficina:$TAG -n oficina
          kubectl rollout status deployment/web -n oficina --timeout=180s || {
            echo "Falhou, voltando para a versão anterior"
            kubectl rollout undo deployment/web -n oficina
            exit 1
          }

