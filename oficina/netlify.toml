[build]
  command = "npx prisma generate && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Garante que o Prisma Client seja gerado tanto no build quanto nas
# Netlify Functions que executam as Server Actions / rotas dinâmicas.
[functions]
  node_bundler = "esbuild"
  included_files = ["node_modules/.prisma/client/**"]

[build.environment]
  PRISMA_GENERATE_DATAPROXY = "false"
