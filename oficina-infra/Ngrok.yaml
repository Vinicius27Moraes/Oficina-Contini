

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngrok
  namespace: oficina
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ngrok
  template:
    metadata:
      labels:
        app: ngrok
    spec:
      containers:
      - name: ngrok
        image: ngrok/ngrok:latest
        args: ["http", "web:3000", "--url=grazing-stoppage-monoxide.ngrok-free.dev"]   # <-- TROCAR
        envFrom:
        - secretRef:
            name: ngrok-secret
        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits: { memory: 128Mi }
